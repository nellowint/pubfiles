{% load i18n %}
{% if ad.is_script %}
    <div class="ad-script-container" style="width: 100%; height: 100%; min-height: 250px; min-width: 300px; display: block; position: relative;">
        {{ ad.link|safe }}
    </div>
{% else %}
<a href="{{ ad.link }}" target="_blank" rel="noopener sponsored" class="ad-link">
    <span class="ad-badge">AD</span>
</a>
{% endif %}
