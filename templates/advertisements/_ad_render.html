{% load i18n %}
{% if ad.is_script %}
    <div class="ad-script-container" style="width: 100%; max-width: 320px; margin: 0 auto; min-height: 50px; min-width: 320px; display: block; position: relative;">
        {{ ad.link|safe }}
    </div>
{% else %}
<a href="{{ ad.link }}" target="_blank" rel="noopener sponsored" class="ad-link">
    <span class="ad-badge">{% trans 'Access' %}</span>
</a>
{% endif %}
